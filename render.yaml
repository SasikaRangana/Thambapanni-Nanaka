services:
  - type: web
    name: thambapanni-nanaka-api
    env: python
    region: singapore # Closest low-latency region for Sri Lanka & Asia
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DEFAULT_CURRENCY_SYMBOL
        value: LKR
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: CORS_ORIGINS
        sync: false
